<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="notisurGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Fondo redondeado elegante y corporativo -->
  <rect width="64" height="64" rx="14" fill="url(#notisurGrad)" />
  
  <!-- Barra de acento periodístico vertical -->
  <rect x="10" y="14" width="4.5" height="36" rx="2" fill="url(#accentGrad)" />
  
  <!-- Letra 'N' estilizada e imponente -->
  <path d="M22 46 V18 L40 46 V18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Detalle sutil de señal digital/comunicación en la esquina superior derecha -->
  <circle cx="50" cy="18" r="3" fill="#38bdf8" />
</svg>
